slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 0.5
    # 2026-08-22: raised from 0.04 - user reported the web map looked low-res;
    # finer grid cells show more real wall/room detail per pixel.
    resolution: 0.025
    # 2026-09-05: do_loop_closing re-enable (2026-08-30) was only idle-tested;
    # during real motion it produced two large scan-match jumps this session
    # (yaw_delta_deg 126 and 176 in ~1s, both auto-caught by the MAP JUMP
    # WATCHDOG - see app.py/services/ros2_slam.py detect_pose_jump) causing
    # the robot to appear to "spin wildly then freeze" and the map to keep
    # getting reset. Reverting per the documented rollback condition.
    restamp_tf: false
    min_laser_range: 0.0
    max_laser_range: 8.0
    minimum_time_interval: 0.2
    # Widened from 0.3s: Pi 5 CPU load spikes (Nav2 + camera/mic ML running
    # alongside) can occasionally delay TF delivery past a tight tolerance,
    # producing spurious extrapolation warnings; robot moves slowly (<=0.24 m/s).
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.15
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # 2026-08-30: was 3.0 - re-enabling loop closing (see below) in a small/
    # feature-poor room needs a tighter search radius to cut down on
    # spurious revisit matches against an unrelated, similar-looking corner.
    loop_search_maximum_distance: 1.5
    # 2026-08-22: was disabled for diagnostics - /map/pose was observed
    # jumping/drifting (up to ~0.9m, tens of degrees) over tens of seconds while
    # the robot was fully idle (no drive commands), and the exported map showed
    # disjoint scan streaks instead of solid walls, consistent with spurious
    # loop-closure corrections against a small/feature-poor map.
    # 2026-08-30: re-enabled, paired with a tighter loop_search_maximum_distance
    # and higher loop_match_minimum_response_coarse/fine below, to reduce the
    # false-positive-match risk instead of leaving the correction mechanism
    # off entirely. Only idle-tested at the time (100s stationary, zero
    # jumps) - explicitly flagged as needing a live in-motion validation
    # before trusting it during real exploration.
    # 2026-09-05: REVERTED to false - the in-motion validation failed. Two
    # separate live wander/explore runs each produced one large scan-match
    # jump (yaw_delta_deg 126.5 and 176.2, both within ~1s), both caught by
    # the MAP JUMP WATCHDOG (auto SLAM reset + exploration stop). This is
    # exactly the rollback condition documented above, and matches the
    # user-reported symptom (robot appears to spin/jerk then suddenly stop,
    # map looks weak/wrong) - the jump is a bad loop-closure correction in
    # the SLAM pose, not an actual physical motor spin.
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    # 2026-08-30: was 0.35/0.45 - raised both to require stronger match
    # confidence before accepting a loop closure (see do_loop_closing above).
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    # 2026-09-14: was 0.1 - in a long feature-poor corridor the scan matcher was
    # repeatedly picking a near-180deg-flipped match (MAP JUMP WATCHDOG caught
    # yaw_delta_deg up to 175 in <1s, do_loop_closing already false so this was
    # the plain scan matcher, not loop closure) - a straight corridor looks
    # almost identical facing either way, so a wide/smeared correlation peak
    # let the wrong-orientation candidate score competitively. Sharper peak
    # (lower smear) reduces how easily two near-symmetric candidates tie.
    correlation_search_space_smear_deviation: 0.05

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # 2026-09-14: both raised (0.5/1.0) alongside the smear_deviation change
    # above - these penalize a candidate match the further it sits from the
    # odometry-predicted pose, making the matcher trust odometry continuity
    # more and reject a same-score-but-flipped candidate instead of jumping
    # to it.
    # 2026-09-19 correction: the "physically impossible above max_vel_theta
    # 0.45 rad/s (25.8 deg/s)" assumption behind this whole tuning section
    # was live-measured and disproven this session - real gyro readings
    # during ordinary nav2-commanded turns (well below the motor-percent
    # ceiling) routinely hit 35-70+ deg/s, and 90-100 deg/s at the actual
    # turn-percent ceiling (see /memories/repo/robotpi_slam_notes.md). The
    # fused odom yaw RATE is still trustworthy (EKF fuses real MPU6050
    # gyro_z for yaw, not the separately-buggy encoder-derived estimate), so
    # tightening the search space around that prior (rather than assuming a
    # slow max speed) is still the right lever - see coarse_search_angle_offset
    # below, narrowed for the same reason.
    distance_variance_penalty: 1.0
    angle_variance_penalty: 3.0

    fine_search_angle_offset: 0.00349
    # 2026-09-19: was 0.349 (20deg) - with real turns hitting 35-100+ deg/s
    # (see note above), a coarse search this wide still lets a ~40-90deg-off
    # (wrong-orientation) candidate be considered and occasionally win in a
    # feature-poor/symmetric space (3 gross MAP JUMP WATCHDOG events in one
    # ~3min run were observed at this setting). The odometry prior's yaw rate
    # comes straight from the real gyro (see above), so it should already be
    # accurate within a much smaller margin than 20deg over one scan-match
    # step; narrowing this to bound out those far-off candidates instead of
    # only penalizing them. NEEDS a live in-motion validation pass (repeat the
    # explore/wander test and watch for MAP JUMP WATCHDOG triggers) before
    # trusting it fully - revert to 0.349 if legitimate fast turns start
    # producing scan-match dropouts/holes instead.
    coarse_search_angle_offset: 0.2
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1