amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # 2026-09-14: nav2's compiled-in default is only 20ms - confirmed via
    # nav2_bringup's reference nav2_params.yaml (this project's config never
    # set it explicitly before). explore_lite resends a goal every ~6-7s
    # (planner_frequency), each resend makes bt_navigator halt() the
    # in-flight FollowPath action first; on this Pi, a concurrent costmap
    # resize (StaticLayer growing as the map fills in) can easily make that
    # cancel/halt round-trip take longer than 20ms, so it timed out with
    # "Failed to get result for follow_path in node halt!" and the whole
    # navigate_to_pose goal was aborted - live-reproduced: explore stopped
    # itself entirely after only ~35s over exactly this error. Widened so a
    # brief scheduling/CPU hiccup doesn't kill an otherwise-healthy goal.
    # 2026-09-14 FOLLOWUP: 2000 still failed, in under 1s - too fast for a
    # mere timeout increase to explain, so this alone isn't the whole story
    # (see planner_frequency note in explore_lite_params.yaml for the other
    # half of the fix). Kept generous regardless.
    default_server_timeout: 6000
    # Custom bounded recovery: after a controller collision, attempt one
    # collision-checked short BackUp and replan. If retreat is unsafe, try
    # Spin; a still-failed goal returns to explore_lite for blacklisting.
    default_nav_to_pose_bt_xml: /home/robotpi/projects/robotpi/config/nav2_bt_recovery_backup_first.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 8.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # Rotation about the axle is meaningful during close-range escape and
      # final alignment. The previous XY-only checker aborted this maneuver.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.20
      # A low obstacle below the laser can stop the chassis while the wheels
      # keep turning. Do not push against it for 15 s before trying the
      # collision-checked backup; allow brief starts and controller pauses.
      movement_time_allowance: 4.0

    goal_checker:
      # Frontier goals are observation positions, not required final headings.
      # Requiring a yaw match made the robot turn in place next to a wall after
      # reaching the goal XY, then fail its progress check.
      plugin: "nav2_controller::PositionGoalChecker"
      # 1cm was unrealistic for real LIDAR/odom noise - the controller could
      # spend the whole progress-check window hunting for exact precision.
      xy_goal_tolerance: 0.10
      stateful: true

    FollowPath:
      # The differential-drive lattice emits forward paths with in-place
      # turns. RPP must align to those headings instead of reversing toward a
      # lookahead point behind the robot.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.144
      lookahead_dist: 0.30
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.11
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.70
      rotate_to_heading_angular_vel: 0.30
      # At 8 Hz, 0.20 rad/s² allowed only 0.025 rad/s from stationary.
      # Fixed-PWM wheel pulses could not produce sustained odometry at that
      # request, so each cycle restarted at the same near-zero command.
      max_angular_accel: 1.0
      allow_reversing: false
      transform_tolerance: 0.20
      stateful: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 3.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Differential-drive motion primitives generated at 5 cm resolution and
      # 18 cm turning radius; in-place turns avoid short reverse/forward cusps.
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      tolerance: 0.10
      allow_unknown: true
      max_planning_time: 3.0
      lattice_filepath: "/home/robotpi/projects/robotpi/config/lattice_primitives_diff_18cm.json"
      allow_reverse_expansion: false
      analytic_expansion_max_length: 1.0
      reverse_penalty: 1.5
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SimpleSmoother"]
    # Retained for other actions; the exploration BT does not smooth a
    # collision-checked State Lattice path.
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 6.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.25
      backup_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_duration: 0.8
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    # Keep recovery spins aligned with the restored FollowPath angular cap.
    max_rotational_vel: 0.45
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      always_send_full_costmap: true
      # Widened from the 0.3s Costmap2DROS default: Pi 5 runs SLAM + Nav2 +
      # camera/mic ML alongside cmd_vel/odom TF publishing, so short CPU load
      # spikes can delay a transform past 0.3s. Robot tops out at 0.24 m/s, so
      # a 0.5s tolerance has negligible safety impact but avoids spurious
      # "Message Filter dropping message"/TF extrapolation warnings.
      transform_tolerance: 0.5
      # base_link is at the rear drive axle. The 0.23 m body center is about
      # 0.155 m ahead of it, inferred together with the laser TF from the
      # 2026-10-10 scan/odometry turn test.
      footprint: "[[0.27, 0.07], [0.27, -0.07], [0.04, -0.07], [0.04, 0.07]]"
      plugins: ["obstacle_layer", "range_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          obstacle_max_range: 4.5
      # Nav2's own plugin for single-beam IR/sonar sensors (ingests
      # sensor_msgs/Range directly), replacing the previous ultrasonic_layer
      # hack that faked a 5-beam LaserScan through ObstacleLayer.
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        # Only fresh, stable full-window readings are published by the bridge.
        # Include low obstacles below the LiDAR plane in collision checks.
        enabled: true
        topics: ["/ultrasonic_range"]
        phi: 1.2
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        # A confirmed return at the 20 cm trust limit is still an obstacle.
        # Untrusted distant echoes must never clear near-field obstacles.
        clear_on_max_reading: false
        input_sensor_type: "ALL"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.28
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      rolling_window: true
      width: 12
      height: 12
      track_unknown_space: true
      always_send_full_costmap: true
      # See local_costmap note above re: widened transform_tolerance for Pi 5 CPU load spikes.
      transform_tolerance: 0.5
      # Same footprint as local_costmap.
      footprint: "[[0.27, 0.07], [0.27, -0.07], [0.04, -0.07], [0.04, 0.07]]"
      plugins: ["static_layer", "obstacle_layer", "range_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          obstacle_max_range: 4.5
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic_range"]
        phi: 1.2
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: false
        input_sensor_type: "ALL"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.32
        cost_scaling_factor: 3.0

map_server:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Matches the FollowPath/DWB limits above.
    max_velocity: [0.144, 0.0, 0.45]
    min_velocity: [-0.144, 0.0, -0.45]
    max_accel: [0.35, 0.0, 0.45]
    max_decel: [-0.35, 0.0, -0.45]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    # Nav2's Approach model does a static pre-check: if the (unsimulated,
    # t=0) zone already contains >= min_points, getCollisionTime() returns 0.0
    # regardless of commanded direction, which zeroes velocity even for a
    # pure backup away from the obstacle (confirmed by reading
    # nav2_collision_monitor's polygon.cpp: the direction-blind check runs
    # before the per-step simulation). VelocityPolygon is nav2's own native
    # fix for this: it swaps the active zone shape based on commanded
    # cmd_vel, so we can shrink the zone to the robot's rear half while
    # reversing (excludes a front-flush obstacle from the check) while
    # keeping the full footprint zone for forward/rotate-in-place motion.
    # Robot footprint matches the axle-relative costmap footprint above.
    FootprintApproach:
      type: "velocity_polygon"
      action_type: "approach"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
      holonomic: false
      velocity_polygons: ["translation_forward", "translation_backward", "stopped"]
      translation_forward:
        points: "[[0.27, 0.07], [0.27, -0.07], [0.04, -0.07], [0.04, 0.07]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -1.5
        theta_max: 1.5
      translation_backward:
        # Reverse can clear a front obstacle; the rear axle/bumper sector
        # remains monitored while reversing.
        points: "[[0.04, 0.07], [0.04, -0.07], [-0.02, -0.07], [-0.02, 0.07]]"
        linear_min: -1.0
        linear_max: 0.0
        theta_min: -1.5
        theta_max: 1.5
      stopped:
        points: "[[0.27, 0.07], [0.27, -0.07], [0.04, -0.07], [0.04, 0.07]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -10.0
        theta_max: 10.0
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 20.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 1
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.15
      use_collision_detection: false
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 3.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    # NOT actually used at runtime: nav2_bringup's navigation_launch.py hardcodes
    # its own lifecycle_nodes list and passes it directly to this node's
    # 'node_names' parameter, without loading this yaml file for that node at all.
    # Kept here in sync with that list purely for documentation accuracy.
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - route_server
      - behavior_server
      - velocity_smoother
      - collision_monitor
      - bt_navigator
      - waypoint_follower
      - docking_server
