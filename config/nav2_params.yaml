amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # Stock BT's RoundRobin recovery order is Spin -> Wait -> BackUp, and its
    # ReactiveFallback checks GoalUpdated first each tick, which skips
    # RecoveryActions entirely whenever explore_lite has already sent a new
    # goal (confirmed live: recovery never ran at all, 0 spin/backup log lines
    # despite repeated stalls). This custom tree removes that GoalUpdated
    # preemption and reorders RecoveryActions to BackUp -> Spin -> Wait -
    # see the file for detail.
    default_nav_to_pose_bt_xml: /home/robotpi/projects/robotpi/config/nav2_bt_recovery_backup_first.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 8.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # See explore_lite_params.yaml note: widened alongside its progress_timeout.
      movement_time_allowance: 45.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 1cm was unrealistic for real LIDAR/odom noise - the controller could
      # spend the whole progress-check window hunting for exact precision.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Was 0.0 to allow pure in-place pivots, but on this 4WD skid-steer
      # chassis a vx=0 turn needs way more torque to beat scrub friction on
      # all 4 wheels than the firmware's MIN_EFFECTIVE_SPEED provides - the
      # commanded omega just spun the wheels without turning the robot
      # (confirmed live: gyro stayed ~0 while a nonzero turn was continuously
      # sent). Forcing a small forward creep makes every turn a rolling arc
      # instead of a dead pivot, which the chassis can actually execute.
      min_vel_x: 0.04
      max_vel_x: 0.24
      # Lowered from 1.0/1.2 - calmer normal-wander turning; door-threshold
      # push-through recovery lives in services/motor.py, unaffected by this.
      max_vel_theta: 0.45
      min_speed_xy: 0.0
      max_speed_xy: 0.24
      min_speed_theta: 0.0
      acc_lim_x: 0.35
      acc_lim_theta: 0.45
      decel_lim_x: -0.35
      decel_lim_theta: -0.45
      vx_samples: 12
      vtheta_samples: 16
      # Bumped from 1.2s: longer look-ahead lets the planner start curving
      # into a turn earlier instead of driving straight then pivoting late.
      sim_time: 1.6
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # Matches goal_checker.xy_goal_tolerance above - see note there.
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Default RotateToGoal.scale (32) strongly biases DWB toward pure
      # in-place pivots once near the goal; lowered so it's a soft nudge
      # rather than an override, letting GoalAlign/PathAlign steer smoother
      # blended-arc approaches instead. PathAlign/GoalAlign raised to favor
      # trajectories that curve into the local plan's heading rather than
      # snapping to a sharp point turn.
      RotateToGoal.scale: 8.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      BaseObstacle.scale: 0.10

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 3.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 6.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.25
      backup_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_duration: 0.8
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      always_send_full_costmap: true
      # Widened from the 0.3s Costmap2DROS default: Pi 5 runs SLAM + Nav2 +
      # camera/mic ML alongside cmd_vel/odom TF publishing, so short CPU load
      # spikes can delay a transform past 0.3s. Robot tops out at 0.24 m/s, so
      # a 0.5s tolerance has negligible safety impact but avoids spurious
      # "Message Filter dropping message"/TF extrapolation warnings.
      transform_tolerance: 0.5
      # Robot body is ~0.23m front-back x 0.14m wide, centered on base_link.
      footprint: "[[0.115, 0.07], [0.115, -0.07], [-0.115, -0.07], [-0.115, 0.07]]"
      plugins: ["obstacle_layer", "range_layer", "virtual_obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          obstacle_max_range: 4.5
      # Nav2's own plugin for single-beam IR/sonar sensors (ingests
      # sensor_msgs/Range directly), replacing the previous ultrasonic_layer
      # hack that faked a 5-beam LaserScan through ObstacleLayer.
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic_range"]
        phi: 1.2
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: true
        input_sensor_type: "ALL"
      # IMU-flagged obstacles too low for the lidar/ultrasonic to ever see
      # (see services/motor.py invisible-obstacle detection + config's
      # ROS2_VIRTUAL_OBSTACLES_*). Mark-only, no clearing/raytracing, so a
      # normal costmap clear (e.g. Nav2's own recovery) can't erase these.
      virtual_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: virtual_obstacles
        virtual_obstacles:
          topic: /virtual_obstacles
          clearing: false
          marking: true
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          obstacle_max_range: 4.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.28
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      rolling_window: true
      width: 12
      height: 12
      track_unknown_space: true
      always_send_full_costmap: true
      # See local_costmap note above re: widened transform_tolerance for Pi 5 CPU load spikes.
      transform_tolerance: 0.5
      # Same footprint as local_costmap.
      footprint: "[[0.115, 0.07], [0.115, -0.07], [-0.115, -0.07], [-0.115, 0.07]]"
      plugins: ["static_layer", "obstacle_layer", "range_layer", "virtual_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          obstacle_max_range: 4.5
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic_range"]
        phi: 1.2
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: true
        input_sensor_type: "ALL"
      virtual_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: virtual_obstacles
        virtual_obstacles:
          topic: /virtual_obstacles
          clearing: false
          marking: true
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          obstacle_max_range: 4.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.32
        cost_scaling_factor: 3.0

map_server:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Matches the calmer FollowPath/DWB limits above for smoother normal wander.
    max_velocity: [0.24, 0.0, 0.45]
    min_velocity: [-0.24, 0.0, -0.45]
    max_accel: [0.35, 0.0, 0.45]
    max_decel: [-0.35, 0.0, -0.45]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    # Nav2's Approach model does a static pre-check: if the (unsimulated,
    # t=0) zone already contains >= min_points, getCollisionTime() returns 0.0
    # regardless of commanded direction, which zeroes velocity even for a
    # pure backup away from the obstacle (confirmed by reading
    # nav2_collision_monitor's polygon.cpp: the direction-blind check runs
    # before the per-step simulation). VelocityPolygon is nav2's own native
    # fix for this: it swaps the active zone shape based on commanded
    # cmd_vel, so we can shrink the zone to the robot's rear half while
    # reversing (excludes a front-flush obstacle from the check) while
    # keeping the full footprint zone for forward/rotate-in-place motion.
    # Robot footprint is the same 0.23m x 0.14m rectangle used by the
    # costmaps above (see local_costmap.footprint note).
    FootprintApproach:
      type: "velocity_polygon"
      action_type: "approach"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
      holonomic: false
      velocity_polygons: ["translation_forward", "translation_backward", "stopped"]
      translation_forward:
        points: "[[0.115, 0.07], [0.115, -0.07], [-0.115, -0.07], [-0.115, 0.07]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -1.5
        theta_max: 1.5
      translation_backward:
        # Front boundary pulled back to x=0.0 (excludes the front bumper
        # area) so an obstacle the robot is already flush against doesn't
        # block reversing away from it. Rear boundary kept at the real
        # footprint extent so genuine rear obstacles still stop the backup.
        points: "[[0.0, 0.07], [0.0, -0.07], [-0.115, -0.07], [-0.115, 0.07]]"
        linear_min: -1.0
        linear_max: 0.0
        theta_min: -1.5
        theta_max: 1.5
      stopped:
        points: "[[0.115, 0.07], [0.115, -0.07], [-0.115, -0.07], [-0.115, 0.07]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -10.0
        theta_max: 10.0
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 20.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 1
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.15
      use_collision_detection: false
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 3.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
