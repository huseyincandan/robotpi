amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 8.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # See explore_lite_params.yaml note: widened alongside its progress_timeout.
      movement_time_allowance: 45.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 1cm was unrealistic for real LIDAR/odom noise - the controller could
      # spend the whole progress-check window hunting for exact precision.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Keep zero linear velocity in the sample set so DWB can turn in place
      # when every forward arc is blocked.
      min_vel_x: 0.0
      max_vel_x: 0.24
      # Lowered from 1.0/1.2 - calmer normal-wander turning; door-threshold
      # push-through recovery lives in services/motor.py, unaffected by this.
      max_vel_theta: 0.45
      min_speed_xy: 0.0
      max_speed_xy: 0.24
      min_speed_theta: 0.0
      acc_lim_x: 0.35
      acc_lim_theta: 0.45
      decel_lim_x: -0.35
      decel_lim_theta: -0.45
      vx_samples: 12
      vtheta_samples: 16
      # Bumped from 1.2s: longer look-ahead lets the planner start curving
      # into a turn earlier instead of driving straight then pivoting late.
      sim_time: 1.6
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # Matches goal_checker.xy_goal_tolerance above - see note there.
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Default RotateToGoal.scale (32) strongly biases DWB toward pure
      # in-place pivots once near the goal; lowered so it's a soft nudge
      # rather than an override, letting GoalAlign/PathAlign steer smoother
      # blended-arc approaches instead. PathAlign/GoalAlign raised to favor
      # trajectories that curve into the local plan's heading rather than
      # snapping to a sharp point turn.
      RotateToGoal.scale: 8.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      BaseObstacle.scale: 0.10

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 3.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 6.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.25
      backup_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_duration: 0.8
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      always_send_full_costmap: true
      # Widened from the 0.3s Costmap2DROS default: Pi 5 runs SLAM + Nav2 +
      # camera/mic ML alongside cmd_vel/odom TF publishing, so short CPU load
      # spikes can delay a transform past 0.3s. Robot tops out at 0.24 m/s, so
      # a 0.5s tolerance has negligible safety impact but avoids spurious
      # "Message Filter dropping message"/TF extrapolation warnings.
      transform_tolerance: 0.5
      # Robot body is ~0.23m front-back x 0.14m wide, centered on base_link.
      footprint: "[[0.115, 0.07], [0.115, -0.07], [-0.115, -0.07], [-0.115, 0.07]]"
      plugins: ["obstacle_layer", "ultrasonic_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          obstacle_max_range: 4.5
      ultrasonic_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: ultrasonic
        ultrasonic:
          topic: /ultrasonic_scan
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.2
          obstacle_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.28
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      rolling_window: true
      width: 12
      height: 12
      track_unknown_space: true
      always_send_full_costmap: true
      # See local_costmap note above re: widened transform_tolerance for Pi 5 CPU load spikes.
      transform_tolerance: 0.5
      # Same footprint as local_costmap.
      footprint: "[[0.115, 0.07], [0.115, -0.07], [-0.115, -0.07], [-0.115, 0.07]]"
      plugins: ["static_layer", "obstacle_layer", "ultrasonic_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          obstacle_max_range: 4.5
      ultrasonic_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: ultrasonic
        ultrasonic:
          topic: /ultrasonic_scan
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.2
          obstacle_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.32
        cost_scaling_factor: 3.0

map_server:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Matches the calmer FollowPath/DWB limits above for smoother normal wander.
    max_velocity: [0.24, 0.0, 0.45]
    min_velocity: [-0.24, 0.0, -0.45]
    max_accel: [0.35, 0.0, 0.45]
    max_decel: [-0.35, 0.0, -0.45]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 20.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 1
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.15
      use_collision_detection: false
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 3.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
